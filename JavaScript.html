<script>
let MASTER = { plants: [], areas: [], zones: [] };
let GPS = { lat: '', lng: '' };
let COMPRESSED_PIC = null, ZONES = [], CUR = null;
const TARGET_KB = 200;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GROUPS = [
  { k: 'A', n: 'GRUP A', c: '#1f5a8a' }, { k: 'B', n: 'GRUP B', c: '#1e8a4c' },
  { k: 'C', n: 'GRUP C', c: '#e8651a' }, { k: 'D', n: 'GRUP D', c: '#7b3fa0' }
];

/* ---------- INIT ---------- */
window.addEventListener('load', () => {
  toggleDlOptions();
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => { GPS.lat = p.coords.latitude.toFixed(7); GPS.lng = p.coords.longitude.toFixed(7); },
      () => {}, { enableHighAccuracy: true, timeout: 8000 });
  }
  google.script.run
    .withSuccessHandler(data => {
      MASTER = data;
      const sel = $('plant');
      sel.innerHTML = '<option value="">-- Pilih Plant --</option>';
      data.plants.forEach(p => sel.add(new Option(p.name, p.id)));
    })
    .withFailureHandler(e => showMsg('Gagal memuat data Plant: ' + e.message, false))
    .getMasterData();
  window.addEventListener('resize', fitBoard);
});

/* ---------- NAV ---------- */
function showView(v) {
  ['input', 'jobdesk', 'output', 'foto'].forEach(x => {
    $('view-' + x).style.display = x === v ? 'flex' : 'none';
    $('nav-' + x).classList.toggle('active', x === v);
  });
  if (v === 'jobdesk' && typeof initJobdesk === 'function') initJobdesk();
  if (v === 'foto' && typeof initFoto === 'function') initFoto();
  if (v === 'output' && !ZONES.length) loadZones();
  window.scrollTo(0, 0);
}

/* ---------- FORM: DROPDOWN ---------- */
function onPlantChange() {
  const pid = $('plant').value;
  const areaSel = $('area'), zoneSel = $('zone');
  areaSel.innerHTML = '<option value="">-- Pilih Area --</option>';
  zoneSel.innerHTML = '<option value="">-- Pilih Zona --</option>';
  zoneSel.disabled = true;
  $('areaLayoutHint').textContent = ''; $('zoneLayoutHint').textContent = '';
  if (!pid) { areaSel.disabled = true; return; }
  MASTER.areas.filter(a => a.groupId === pid).forEach(a => areaSel.add(new Option(`${a.id} — ${a.name}`, a.id)));
  areaSel.disabled = false;
}

function onAreaChange() {
  const aid = $('area').value;
  const zoneSel = $('zone');
  zoneSel.innerHTML = '<option value="">-- Pilih Zona --</option>';
  $('zoneLayoutHint').textContent = '';
  $('areaLayoutHint').textContent = '';
  if (!aid) { zoneSel.disabled = true; return; }
  const area = MASTER.areas.find(a => a.id === aid);
  if (area && area.layoutUrl) $('areaLayoutHint').innerHTML = `📐 <a href="${esc(area.layoutUrl)}" target="_blank">Lihat layout area</a>`;
  MASTER.zones.filter(z => z.areaId === aid).forEach(z => {
    const o = new Option(`${z.id} — ${z.name}`, z.id);
    o.dataset.layout = z.layoutUrl || '';
    zoneSel.add(o);
  });
  zoneSel.disabled = false;
}

$('zone').addEventListener('change', e => {
  const url = e.target.selectedOptions[0]?.dataset.layout;
  $('zoneLayoutHint').innerHTML = url ? `📐 <a href="${esc(url)}" target="_blank">Lihat layout zona</a>` : '';
});

/* ---------- FORM: FOTO ---------- */
async function handlePhotoSelect(input) {
  if (!input.files || !input.files.length) return;
  const file = input.files[0];
  const img = $('previewPic'), info = $('infoPic');
  info.style.display = 'block'; info.style.color = '#0a7'; info.textContent = 'Mengompres...';
  img.style.display = 'none';
  try {
    const result = await compressToTargetSize(file, TARGET_KB);
    COMPRESSED_PIC = result;
    img.src = result.data; img.style.display = 'block';
    info.textContent = `✅ ${result.sizeKB} KB (Siap dikirim)`;
    $('fotoPicCamera').value = ''; $('fotoPicGallery').value = '';
  } catch (e) {
    info.textContent = '❌ ' + e.message; info.style.color = '#d33';
    COMPRESSED_PIC = null;
  }
}

async function compressToTargetSize(file, targetKB = 200, maxDim = 1280) {
  const targetBytes = targetKB * 1024;
  const img = await loadImage(file);
  for (const dim of [maxDim, 960, 720, 540, 400]) {
    const { w, h } = fitDimensions(img.width, img.height, dim);
    const canvas = drawToCanvas(img, w, h);
    let lo = 0.30, hi = 0.90, best = null;
    for (let i = 0; i < 7; i++) {
      const q = (lo + hi) / 2;
      const dataUrl = canvas.toDataURL('image/jpeg', q);
      const bytes = dataUrl.length * 0.75;
      if (bytes <= targetBytes) { best = { dataUrl, q, bytes }; lo = q; } else { hi = q; }
    }
    if (best) return { data: best.dataUrl, mimeType: 'image/jpeg', sizeKB: Math.round(best.bytes / 1024) };
  }
  throw new Error('Gagal kompres di bawah ' + targetKB + ' KB.');
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = reject;
    img.src = url;
  });
}
function fitDimensions(w, h, maxDim) {
  if (w <= maxDim && h <= maxDim) return { w, h };
  if (w >= h) return { w: maxDim, h: Math.round(h * maxDim / w) };
  return { w: Math.round(w * maxDim / h), h: maxDim };
}
function drawToCanvas(img, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  return c;
}

/* ---------- FORM: SUBMIT ---------- */
function submitForm(ev) {
  ev.preventDefault();
  if (!COMPRESSED_PIC) { showMsg('Pastikan Foto PIC sudah dipilih dan selesai diproses.', false); return false; }

  const btn = $('btnSubmit');
  btn.disabled = true;
  $('loadingText').innerHTML = 'Mengirim data...<br><small>Mohon tunggu sebentar</small>';
  $('loadingOverlay').style.display = 'flex';

  const plantSel = $('plant'), areaSel = $('area'), zoneSel = $('zone');
  const payload = {
    plant: plantSel.value,
    plantName: plantSel.selectedOptions[0].textContent,
    areaId: areaSel.value,
    areaName: areaSel.selectedOptions[0].textContent,
    zoneId: zoneSel.value,
    zoneName: zoneSel.selectedOptions[0].textContent,
    namaPic: $('namaPic').value.trim(),
    nik: $('nik').value.trim(),
    departemen: $('departemen').value.trim(),
    grup: $('grup').value,
    keterangan: $('keterangan').value.trim(),
    fotoPic: COMPRESSED_PIC,
    gpsLat: GPS.lat, gpsLng: GPS.lng,
    userAgent: navigator.userAgent
  };

  google.script.run
    .withSuccessHandler(r => {
      $('loadingOverlay').style.display = 'none';
      showMsg(r.message, true); resetForm(); btn.disabled = false;
      ZONES = []; // paksa muat ulang daftar output
      if (typeof PIC_LOADED !== 'undefined') { PIC_LOADED = false; PIC_ITEMS = []; }
    })
    .withFailureHandler(e => {
      $('loadingOverlay').style.display = 'none';
      showMsg('Gagal: ' + e.message, false); btn.disabled = false;
    })
    .submitForm(payload);
  return false;
}

function resetForm() {
  $('mainForm').reset();
  COMPRESSED_PIC = null;
  $('previewPic').style.display = 'none';
  $('infoPic').style.display = 'none';
  $('area').disabled = true; $('zone').disabled = true;
  $('areaLayoutHint').textContent = ''; $('zoneLayoutHint').textContent = '';
}

function showMsg(text, ok) {
  const m = $('msg');
  m.textContent = text;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
}

/* ---------- OUTPUT: DAFTAR ZONA ---------- */
function loadZones(force) {
  $('zoneList').innerHTML = '<div class="empty">Memuat...</div>';
  google.script.run
    .withSuccessHandler(z => {
      ZONES = z;
      const f = $('fPlant'), cur = f.value;
      f.innerHTML = '<option value="">Semua Plant</option>';
      [...new Map(z.map(x => [x.plantId, x.plantName]))].forEach(([id, n]) => f.add(new Option(n, id)));
      f.value = cur;
      renderList();
    })
    .withFailureHandler(e => $('zoneList').innerHTML = `<div class="empty">Gagal memuat: ${esc(e.message)}</div>`)
    .getZoneList();
}

function renderList() {
  const p = $('fPlant').value, q = $('fSearch').value.toLowerCase().trim();
  const list = ZONES.filter(z => (!p || z.plantId === p) &&
    (!q || (z.areaName + ' ' + z.zoneName + ' ' + z.zoneId + ' ' + z.areaId).toLowerCase().includes(q)));
  $('zoneList').innerHTML = list.length ? list.map(z => `
    <div class="zone-item">
      <div class="zt">${esc(z.zoneId)} — ${esc(z.zoneName)}</div>
      <div class="zs">${esc(z.plantName)} · ${esc(z.areaId)} — ${esc(z.areaName)}</div>
      <span class="badge ${z.count ? '' : 'none'}">${z.count ? z.count + ' PIC terdata' : 'Belum ada PIC'}</span>
      <button class="btn-sm" onclick="openBoard('${esc(z.zoneId)}')">👁️ Pratinjau</button>
    </div>`).join('') : '<div class="empty">Tidak ada zona.</div>';
}

/* ---------- OUTPUT: PAPAN ---------- */
function openBoard(zoneId) {
  $('loadingText').innerHTML = 'Memuat papan...<br><small>Mengambil foto dari Drive</small>';
  $('loadingOverlay').style.display = 'flex';
  google.script.run
    .withSuccessHandler(d => {
      $('loadingOverlay').style.display = 'none';
      CUR = d;
      console.log('BOARD', d.pics.map(p => ({ nama: p.name, grup: p.grup, foto: !!p.photo, err: p.err })));
      $('modalTitle').textContent = `${d.info.zoneId} — ${d.info.zoneName}`;
      $('board').innerHTML = buildBoard(d);
      $('modal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
      setTimeout(fitBoard, 30);
    })
    .withFailureHandler(e => { $('loadingOverlay').style.display = 'none'; alert('Gagal: ' + e.message); })
    .getZoneBoard(zoneId);
}

function closeModal() { $('modal').style.display = 'none'; document.body.style.overflow = ''; }

function fitBoard() {
  const b = $('board'), w = $('boardWrap');
  if (!b || $('modal').style.display === 'none') return;
  b.style.transform = 'none';
  const s = Math.min(1, w.clientWidth / 1200);
  b.style.transform = `scale(${s})`;
  w.style.height = Math.ceil(b.offsetHeight * s) + 'px';
}

function picCard(p) {
  const photoStyle = p.photo
    ? ` style="background-image:url(&quot;${esc(p.photo)}&quot;)"`
    : '';
  return `<div class="pic">
    <div class="ph"${photoStyle}></div>
    <div class="nm">${esc(p.name)}</div>
    <div class="id"style="color:#c62828">${p.nik ? `NIK: ${esc(p.nik)}` : 'NIK belum terisi'}</div>
    <div class="dp">${esc(p.dept)}</div>
    ${!p.photo && p.err ? `<div class="dp" style="color:#c62828">Foto gagal: ${esc(p.err).substring(0, 80)}</div>` : ''}</div>`;
}

function isLine3(info) {
  const pid = String(info.plantId || '').toUpperCase();
  const pname = String(info.plantName || '').toUpperCase().replace(/\s+/g, ' ').trim();
  return pid === 'A03' || pname === 'PLANT 3' || pname === 'LINE 3';
}

function isNoGroupArea(info) {
  const aname = String(info.areaName || '').toUpperCase();
  return isLine3(info) && aname.indexOf('PACKAGING') >= 0;
}

function hideGroupD(info) {
  return isLine3(info);
}

function jobdeskBoardHtml(jds) {
  const list = jds.slice(0, 5);
  const rows = list.map((j, idx) => `<tr>
      <td class="jd-board-menit">${idx + 1}</td>
      <td class="jd-board-kegiatan">${esc(j.kegiatan)}</td>
      <td class="jd-board-kriteria">${esc(j.kriteria) || '-'}</td>
    </tr>`).join('');
  return `<table class="jd-board-table">
    <thead><tr><th>Menit</th><th>Kegiatan</th><th>Deskripsi</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function buildBoard(d) {
  const i = d.info;
  const jds = Array.isArray(d.jobdesks) ? d.jobdesks : [];
  const upd = d.updated ? new Date(d.updated).toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' }) : '-';
  const head = `
    <div class="bd-head">
      <div><h2>KEPEMILIKAN &amp; TANGGUNG JAWAB AREA</h2><span class="bd-tag">AREA KITA · TANGGUNG JAWAB KITA · KEBANGGAAN KITA</span></div>
      <div class="bd-badge">MANAJEMEN<br>6S</div>
    </div>
    <div class="bd-zone">${esc(i.plantName)} · ${esc(i.areaName)} · ${esc(i.zoneName)}</div>`;
  const infoBox = `<div class="bd-info"><b>INFO ZONA</b>
        Plant: ${esc(i.plantName)}<br>Area: ${esc(i.areaName)}<br>Zona: ${esc(i.zoneName)}<br>Pembaruan: ${upd}</div>`;
  const foot = `<div class="bd-foot"><span><b>SEIRI</b> RINGKAS</span><span><b>SEITON</b> RAPI</span><span><b>SEISO</b> RESIK</span>
      <span><b>SEIKETSU</b> RAWAT</span><span><b>SHITSUKE</b> RAJIN</span><span><b>KESELAMATAN</b></span></div>`;
  const jobBox = jds.length
    ? `<div class="bd-jobdesk"><h3>JOBDESK 6S</h3>${jobdeskBoardHtml(jds)}</div>` : '';

  if (isNoGroupArea(i)) {
    const pics = Array.isArray(d.pics) ? d.pics : [];
    const picPanel = `<div class="bd-day bd-nogroup-pic"><h3>NON SHIFT (TIM HARIAN)</h3>
      <div class="row">${pics.length ? pics.map(picCard).join('') : '<div class="bd-none" style="width:100%">Belum ada PIC</div>'}</div></div>`;
    return `${head}
    ${picPanel}
    <div class="bd-low bd-low-single">${infoBox}</div>
    ${jobBox}
    ${foot}`;
  }

  const groups = GROUPS.filter(g => !(hideGroupD(i) && g.k === 'D'));
  const cols = groups.map(g => {
    const ps = d.pics.filter(p => p.grup === g.k);
    return `<div class="bd-col" style="--gc:${g.c}"><h3>${g.n}</h3>
      <div class="bd-body">${ps.length ? ps.map(picCard).join('') : '<div class="bd-none">Belum ada PIC</div>'}</div></div>`;
  }).join('');
  const jobBoxLeft = jds.length
    ? `<div class="bd-day bd-day-jd"><h3>JOBDESK 6S</h3>${jobdeskBoardHtml(jds)}</div>`
    : `<div class="bd-day bd-day-jd"><h3>JOBDESK 6S</h3><div class="bd-none">Belum ada jobdesk</div></div>`;
  return `${head}
    <div class="bd-groups" style="grid-template-columns:repeat(${groups.length},1fr)">${cols}</div>
    <div class="bd-low">${jobBoxLeft}${infoBox}</div>
    ${foot}`;
}


/* ============================================
   CETAK PREVIEW LANGSUNG KE PDF F4
   Tidak menggunakan canvas atau jsPDF
   Tidak menggambar ulang foto
   ============================================ */

function toggleDlOptions() {
  const fmt = $('dlFormat');
  const orient = $('dlOrient');
  if (!fmt || !orient) return;
  const isPdf = fmt.value === 'pdf';
  orient.style.display = isPdf ? '' : 'none';
  orient.disabled = !isPdf;
}

function boardImagesReady_(board) {
  const images = Array.from(board.querySelectorAll('img'));
  return images.every(img => img.complete && img.naturalWidth > 0);
}

function saveBlob_(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadBoard() {
  const fmt = $('dlFormat') ? $('dlFormat').value : 'pdf';
  if (fmt === 'png') {
    downloadBoardPng();
    return;
  }
  downloadBoardPdf();
}

async function downloadBoardPng() {
  if (!CUR) {
    alert('Silakan buka pratinjau zona terlebih dahulu.');
    return;
  }

  const board = $('board');
  if (!board) {
    alert('Poster tidak ditemukan.');
    return;
  }

  if (typeof window.html2canvas !== 'function') {
    alert('Library PNG belum termuat. Silakan muat ulang halaman.');
    return;
  }

  if (!boardImagesReady_(board)) {
    alert('Ada foto yang belum selesai dimuat. Silakan coba kembali.');
    return;
  }

  const overlay = $('loadingOverlay');
  const loadingText = $('loadingText');
  const wrap = $('boardWrap');
  const oldTransform = board.style.transform;
  const oldZoom = board.style.zoom;
  const oldWidth = board.style.width;
  const oldWrapHeight = wrap ? wrap.style.height : '';

  try {
    if (overlay) {
      loadingText.innerHTML = 'Menyiapkan PNG Full HD...<br><small>Mohon tunggu sebentar</small>';
      overlay.style.display = 'flex';
    }

    board.style.transform = 'none';
    board.style.zoom = '1';
    board.style.width = '1200px';
    if (wrap) wrap.style.height = board.scrollHeight + 'px';

    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    const w = board.offsetWidth;
    const h = board.scrollHeight;
    if (!w || !h) {
      alert('Ukuran poster tidak valid.');
      return;
    }

    const rendered = await window.html2canvas(board, {
      scale: 2,
      backgroundColor: '#ffffff',
      useCORS: true,
      allowTaint: false,
      logging: false,
      windowWidth: Math.max(document.documentElement.clientWidth, board.scrollWidth),
      windowHeight: Math.max(document.documentElement.clientHeight, board.scrollHeight),
      onclone: doc => {
        const b = doc.getElementById('board');
        if (b) {
          b.style.transform = 'none';
          b.style.zoom = '1';
        }
      }
    });

    const blob = await new Promise(resolve =>
      rendered.toBlob(resolve, 'image/png')
    );
    if (!blob) {
      alert('Gagal membuat PNG.');
      return;
    }

    const stamp = new Date().toISOString().slice(0, 10);
    saveBlob_(blob, 'poster_' + CUR.info.zoneId + '_' + stamp + '.png');
  } catch (e) {
    alert('Gagal membuat PNG: ' + (e && e.message ? e.message : e));
  } finally {
    board.style.transform = oldTransform;
    board.style.zoom = oldZoom;
    board.style.width = oldWidth;
    if (wrap) wrap.style.height = oldWrapHeight;
    if (overlay) overlay.style.display = 'none';
  }
}

function downloadBoardPdf() {
  if (!CUR) {
    alert('Silakan buka pratinjau zona terlebih dahulu.');
    return;
  }

  const board = $('board');
  if (!board) {
    alert('Poster tidak ditemukan.');
    return;
  }

  if (!boardImagesReady_(board)) {
    alert('Ada foto yang belum selesai dimuat. Silakan coba kembali.');
    return;
  }

  const orient = $('dlOrient');
  const landscape = orient && orient.value === 'landscape';
  const pageWidth = landscape ? 330 : 210;
  const pageHeight = landscape ? 210 : 330;
  const margin = 5;

  const boardWidth = board.offsetWidth;
  const boardHeight = board.scrollHeight;
  if (!boardWidth || !boardHeight) {
    alert('Ukuran poster tidak valid.');
    return;
  }

  const mmToPx = 96 / 25.4;
  const availableWidth = (pageWidth - margin * 2) * mmToPx;
  const availableHeight = (pageHeight - margin * 2) * mmToPx;
  const scale = Math.min(
    availableWidth / boardWidth,
    availableHeight / boardHeight,
    1
  ) * 0.98;

  let style = $('f4PageStyle');
  if (!style) {
    style = document.createElement('style');
    style.id = 'f4PageStyle';
    document.head.appendChild(style);
  }
  style.textContent =
    '@page { size: ' + pageWidth + 'mm ' + pageHeight + 'mm; margin:0; }';

  document.documentElement.style.setProperty(
    '--f4-board-width',
    boardWidth + 'px'
  );
  document.documentElement.style.setProperty(
    '--f4-board-scale',
    String(scale)
  );

  void board.offsetHeight;
  window.print();
}



function cekLibraryPDF() {
  const html2canvasOK =
    typeof window.html2canvas === 'function';

  const jsPDFOK =
    typeof window.jspdf !== 'undefined' &&
    typeof window.jspdf.jsPDF === 'function';

  console.log('html2canvas:', html2canvasOK);
  console.log('jsPDF:', jsPDFOK);

  if (!html2canvasOK || !jsPDFOK) {
    alert(
      'Library PDF belum lengkap:\n' +
      'html2canvas: ' + html2canvasOK + '\n' +
      'jsPDF: ' + jsPDFOK
    );
    return;
  }

  alert('Library PDF siap digunakan!');
}


</script>
