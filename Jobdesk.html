<section id="view-jobdesk" class="view" style="display:none">
<div class="card wide">
  <div class="header" style="margin-bottom:12px">
    <h1>Jobdesk 6S</h1>
    <div class="sub">Rincian kegiatan &amp; deskripsi 6S per Plant, Area, dan Zona</div>
  </div>

  <form id="jdForm" onsubmit="return jdSubmit(event)">
    <div class="grid2">
      <div>
        <label class="req">Plant / Line</label>
        <select id="jdPlant" required onchange="jdOnPlantChange()"><option value="">-- Pilih Plant --</option></select>
      </div>
      <div>
        <label class="req">Area</label>
        <select id="jdArea" required onchange="jdOnAreaChange()" disabled><option value="">-- Pilih Area --</option></select>
      </div>
    </div>

    <label class="req">Zona</label>
    <select id="jdZone" required disabled><option value="">-- Pilih Zona --</option></select>

    <div class="jd-input-head">
      <span>Kategori</span><span>Kegiatan</span><span>Deskripsi</span><span></span>
    </div>
    <div id="jdRows" class="jd-rows-wrap"></div>
    <button type="button" class="btn-sm ghost" onclick="jdAddRow()">+ Tambah Baris</button>

    <button type="submit" id="jdBtnSave">Simpan Jobdesk</button>
    <div class="msg" id="jdMsg"></div>
  </form>

  <div class="jd-list-wrap">
    <div class="jd-list-head">
      <h2>Daftar Jobdesk</h2>
      <div class="toolbar jd-toolbar">
        <select id="jdFilterPlant" onchange="jdRenderList()"><option value="">Semua Plant</option></select>
        <select id="jdFilterCat" onchange="jdRenderList()"><option value="">Semua Kategori</option></select>
        <input id="jdSearch" type="text" placeholder="Cari kegiatan / kriteria / plant / area / zona..." oninput="jdRenderList()">
        <button class="btn-sm" type="button" onclick="jdLoadList(true)">🔄 Muat Ulang</button>
      </div>
    </div>
    <div id="jdCount" class="jd-count"></div>
    <div id="jdList"><div class="empty">Memuat...</div></div>
  </div>
</div>

<div id="jdModal" class="modal" style="display:none">
  <div class="modal-box jd-modal-box">
    <div class="modal-bar">
      <b>Ubah Jobdesk</b>
      <button class="btn-sm ghost" type="button" onclick="jdCloseEdit()">✖ Tutup</button>
    </div>
    <label class="req">Kategori</label>
    <select id="jdEditCat"></select>
    <label class="req">Kegiatan</label>
    <textarea id="jdEditKegiatan" maxlength="1000" placeholder="Tulis kegiatan..."></textarea>
    <label class="req">Deskripsi</label>
    <textarea id="jdEditKriteria" maxlength="1000" placeholder="Tulis deskripsi..."></textarea>
    <div class="jd-modal-actions">
      <button class="btn-sm ghost" type="button" onclick="jdCloseEdit()">Batal</button>
      <button class="btn-sm" type="button" id="jdBtnEditSave" onclick="jdSaveEdit()">Simpan Perubahan</button>
    </div>
    <div class="msg" id="jdEditMsg"></div>
  </div>
</div>
</section>
