/* ============================================
   CETAK POSTER ASLI DARI PREVIEW
   UKURAN PDF F4: 210 x 330 mm
   ============================================ */

@page {
  size: 210mm 330mm;
  margin: 0;
}

@media print {

  html,
  body {
    width: auto !important;
    height: auto !important;
    margin: 0 !important;
    padding: 0 !important;
    background: white !important;
    overflow: visible !important;
  }

  /* Sembunyikan seluruh aplikasi selain poster */
  body > *:not(#modal) {
    display: none !important;
  }

  /* Modal menjadi area cetak biasa */
  #modal {
    display: block !important;
    position: static !important;
    inset: auto !important;
    width: auto !important;
    height: auto !important;
    max-width: none !important;
    max-height: none !important;
    margin: 0 !important;
    padding: 5mm !important;
    border: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    overflow: visible !important;
  }

  #modal .modal-box,
  #modal #boardWrap {
    display: block !important;
    position: static !important;
    width: auto !important;
    height: auto !important;
    min-width: 0 !important;
    min-height: 0 !important;
    max-width: none !important;
    max-height: none !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    border-radius: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    overflow: visible !important;
  }

  /* Sembunyikan tombol modal */
  #modal .modal-bar {
    display: none !important;
  }

  /* Cetak BOARD ASLI, tidak membuat ulang layout */
  #board {
    width: var(--f4-board-width, 1200px) !important;
    max-width: none !important;

    transform: none !important;
    transform-origin: top left !important;

    zoom: var(--f4-board-scale, 0.63) !important;

    margin: 0 !important;
    overflow: visible !important;
  }

  /* Pertahankan semua warna */
  #board,
  #board * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  /* Foto tetap proporsional */
  #board img.ph {
    object-fit: contain !important;
    object-position: center center !important;
  }

  /* Usahakan setiap kartu tidak terpotong */
  #board .pic {
    break-inside: avoid;
    page-break-inside: avoid;
  }
}
